name: Build & Release Extension (Chrome + Firefox)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.4.0). Leave empty to use package.json'
        required: false
        default: ''
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
            VERSION="${RAW_VER#v}"
            TAG="v${VERSION}"
          else
            VERSION="${PKG_VERSION}"
            BASE_TAG="v${VERSION}"
            if git rev-parse "$BASE_TAG" >/dev/null 2>&1 || gh release view "$BASE_TAG" >/dev/null 2>&1; then
              TAG="v${VERSION}-build.${{ github.run_number }}"
            else
              TAG="${BASE_TAG}"
            fi
          fi

          # Temporarily align manifest versions if overridden via workflow input/tag
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = process.argv[1];
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              const wxt = fs.readFileSync('wxt.config.ts', 'utf8')
                .replace(/version:\s*'[^']+'/, \"version: '\" + process.argv[1] + \"'\");
              fs.writeFileSync('wxt.config.ts', wxt);
            " "$VERSION"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build Chrome, Firefox & Firefox AMO Listed MV3 archives
        run: |
          KUMOYOMI_AMO_LISTED=1 pnpm exec wxt zip -b firefox
          AMO_RAW=$(ls .output/*-firefox.zip | head -n 1)
          mv "$AMO_RAW" ".output/kumoyomi-${{ steps.meta.outputs.version }}-firefox-amo-listed.zip"
          pnpm zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHROME_ZIP=$(ls .output/*-chrome.zip | head -n 1)
          FIREFOX_ZIP=$(ls .output/*-firefox.zip | head -n 1)
          AMO_ZIP=".output/kumoyomi-${{ steps.meta.outputs.version }}-firefox-amo-listed.zip"
          PRE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          printf '%s\n' \
            "## KumoYomi ${{ steps.meta.outputs.tag }}" \
            "" \
            "### Quick Installation" \
            "- **Firefox (Desktop — standard / temporary / unlisted):** download \`*-firefox.zip\`, open \`about:debugging#/runtime/this-firefox\` → **Load Temporary Add-on…** and select the \`.zip\` archive (or extracted \`manifest.json\`)." \
            "- **Firefox Add-ons (AMO Listed archive):** \`*-firefox-amo-listed.zip\` replaces blanket host permissions with \`optional_host_permissions\`." \
            "- **Chrome / Brave / Edge:** download \`*-chrome.zip\`, extract it, open \`chrome://extensions\`, enable **Developer mode**, and click **Load unpacked**." \
            "" \
            "### Add the Community Sources Repository" \
            "In KumoYomi → **Sources & Repos**, paste:" \
            "\`https://github.com/KumoYomi-Sources/extensions-source\`" \
            > /tmp/release-notes.md

          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.meta.outputs.tag }}" "$CHROME_ZIP" "$FIREFOX_ZIP" "$AMO_ZIP" --clobber
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              "$CHROME_ZIP" "$FIREFOX_ZIP" "$AMO_ZIP" \
              --title "KumoYomi ${{ steps.meta.outputs.tag }}" \
              --notes-file /tmp/release-notes.md \
              $PRE_FLAG
          fi
